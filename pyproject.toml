[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipm"
version = "1.0.0"
description = "Predictive maintenance on AI4I 2020: classical ML vs deep models vs a small RL maintenance policy"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Reza Manzour" }]
keywords = ["predictive-maintenance", "machine-learning", "pytorch", "reinforcement-learning", "ai4i-2020"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]
deep = ["torch"]

[project.urls]
Repository = "https://github.com/RezaManzour/industrial-predictive-maintenance"
Changelog = "https://github.com/RezaManzour/industrial-predictive-maintenance/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
